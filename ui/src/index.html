<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>昱弘网通 NetKit</title>
<!--
  ★ 样式全在 theme.css，是从昱弘播控（stage）搬来的**同一套**品牌令牌。
    这里不许再写 <style>，也不许出现十六进制颜色 —— 一律 var(--…)。
    理由见 theme.css 顶部：颜色是品牌资产，不许各仓库自己画一份。
-->
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header>
  <!-- 标志来自 08-品牌资产 的下发（部署子项目标识.py），不是这里画的 -->
  <img class="mark" src="../assets/icon.svg" alt="">
  <!-- ★ 品牌名不译：昱弘网通 / Yuhox NetKit 是资产，译了就对不上发票、合同和装机目录 -->
  <h1>昱弘网通<span class="en">Yuhox NetKit</span></h1>
  <!-- 搜索钮：整副牌里唯一一处「想用什么直接打出来」的入口，所以放在顶栏正中偏左，
       不藏进菜单。文字与快捷键由 app.js 现填（要过词典）。 -->
  <button id="find" class="find" type="button"></button>
  <!-- 新手 / 专家模式段：新手只露常用页（带一句人话说明），专家全量展开。
       钮由 app.js 现填现挂（要按当前模式高亮，也要过词典）。 -->
  <div class="modeseg" id="modeseg"></div>
  <!-- 任务中心：谁在跑、跑到哪、怎么停，统一一个入口。钮由 app.js 现填（要过词典），
       面板里的每一条都是后端探针亲口报的，不是界面自己记账。 -->
  <button id="taskbtn" class="taskbtn" type="button"></button>
  <span class="runstate" id="runstate"></span>
  <!-- 主题快切钮：跟随系统 / 深 / 浅 三态循环，设置页里有带预览的完整三选。
       同样由 app.js 现填。 -->
  <button id="themebtn" class="themebtn" type="button"></button>
  <span class="state" id="conn" data-i18n>连接中…</span>
  <span id="lang"></span>
</header>
<!--
  ★ 壳层三栏：侧栏是**六个一级入口**的任务树（开始 / 网络 / 设备 / 修复 / 工具 / 设置），
    条目带一句人话说明；中间是内容，上方一条面包屑报出「你在哪个入口的哪一页」；
    右边是这一页的上下文（用到哪几件事、最近问过什么）—— 专家模式的检查器。
    窄于 1240px 时右栏收起。
-->
<div class="shell">
  <nav id="nav"></nav>
  <div class="work">
    <div id="crumbs"></div>
    <main id="main"></main>
  </div>
  <aside id="rail"></aside>
</div>
<!--
  ★ 状态栏：工具数 / 当前模式 / 所在页 / 后端地址，全部由 app.js 从能力表现算 ——
    写死一个数就是埋一颗雷（加一个工具那天起，屏上那句话开始撒谎）。
-->
<footer class="statusbar" id="statusbar"></footer>
<!--
  ★★ 这里**不许**再写 <script src="app.js">：app.js 得等词典就位之后再解析。
    它顶部那三十多张判定码表存的是 t('中文') 的返回值，词典异步先到还是 app.js 先到
    决定了选英文的人冷启动看见的是英文还是中文 —— 由 i18n.js 的 i18nBoot 负责按顺序拉进来。
-->
<script src="i18n.js"></script>
</body>
</html>
